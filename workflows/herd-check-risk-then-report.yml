name: Herd check risk then report
description: Looks up a person in Herd and reports the detection only when their Herd risk band is High or Critical.
trigger:
  name: On demand
  type: On demand
  next: lookup_herd_user
  parameters:
    type: object
    properties:
      organization_id:
        type: string
        description: Your Herd organization ID
      user_email:
        type: string
        description: Email address of the person the detection is about
      alert_type:
        type: string
        description: Detection name or rule; must match an alert-to-training mapping in Herd
      severity:
        type: string
        description: low, medium, high or critical
      description:
        type: string
        description: Short summary of the detection
      detection_id:
        type: string
        description: Stable Falcon detection or alert id
    required:
      - organization_id
      - user_email
      - alert_type
      - severity
      - description
actions:
  lookup_herd_user:
    id: api_integrations.Herd look up user.lookupHerdUser
    properties:
      email: ${data['user_email']}
    next:
      - risk_is_high
  report_to_herd:
    id: api_integrations.Herd report detection.reportHerdDetection
    properties:
      organizationId: ${data['organization_id']}
      alertType: ${data['alert_type']}
      userEmail: ${data['user_email']}
      severity: ${data['severity']}
      description: ${data['description']}
      source: crowdstrike
      eventId: ${data['detection_id']}
conditions:
  risk_is_high:
    cel_expression: data['lookup_herd_user.API_Integration.Custom_Herd look up user.body']['data']['risk'] != null && data['lookup_herd_user.API_Integration.Custom_Herd look up user.body']['data']['risk']['band'] in ['HIGH', 'CRITICAL']
    next: report_to_herd
output_fields: []
